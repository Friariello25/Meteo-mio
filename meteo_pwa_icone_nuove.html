<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e88e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-3d-192.png">
<link rel="apple-touch-icon" href="icon-3d-192.png">
<title>Meteo</title>
<style>
  :root { --bg1:#1e88e5; --bg2:#42a5f5; --bg3:#90caf9; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(165deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    background-attachment: fixed;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.22);
    padding: max(18px, env(safe-area-inset-top)) 14px 32px;
  }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; }
  small { opacity: .75; }
  .svg-ic { display: block; margin: 0 auto; overflow: visible; filter: drop-shadow(0 5px 7px rgba(0,0,0,.28)); }

  /* Animazioni delle icone (solo l'icona grande in alto) */
  .anim .raggi { transform-box: fill-box; transform-origin: center; animation: gira 26s linear infinite; }
  .anim .alone { transform-box: fill-box; transform-origin: center; animation: pulsa 4s ease-in-out infinite; }
  .anim .stella { transform-box: fill-box; transform-origin: center; animation: brilla 2.6s ease-in-out infinite; }
  .anim .goccia { animation: cade 1.1s linear infinite; }
  .anim .fiocco { transform-box: fill-box; transform-origin: center; animation: neva 3.2s linear infinite; }
  .anim .fulmine { animation: lampo 3.4s linear infinite; }
  .anim .nebbia-l { animation: scorri 6s ease-in-out infinite alternate; }
  .anim .nuvola-a { animation: deriva 8s ease-in-out infinite alternate; }
  @keyframes gira { to { transform: rotate(360deg); } }
  @keyframes pulsa { 50% { transform: scale(1.1); opacity: .75; } }
  @keyframes brilla { 50% { transform: scale(.55); opacity: .3; } }
  @keyframes cade { 0% { transform: translateY(-3px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(11px); opacity: 0; } }
  @keyframes neva { 0% { transform: translate(0,-4px) rotate(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(2px,11px) rotate(180deg); opacity: 0; } }
  @keyframes lampo { 0%,50%,100% { opacity: .3; } 52% { opacity: 1; } 55% { opacity: .35; } 58% { opacity: 1; } 66% { opacity: .3; } }
  @keyframes scorri { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
  @keyframes deriva { from { transform: translateX(-2px); } to { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) { .anim * { animation: none !important; } }

  /* Ricerca */
  .cerca { display: flex; gap: 8px; margin-bottom: 14px; }
  .cerca input {
    flex: 1; min-width: 0; padding: 13px 16px; border: 1px solid rgba(255,255,255,.25); border-radius: 16px; font-size: 1rem;
    background: rgba(255,255,255,.16); color: #fff; outline: none; text-shadow: none;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .cerca input::placeholder { color: rgba(255,255,255,.7); }
  .cerca button {
    width: 50px; border: none; border-radius: 16px; font-size: 1.2rem; cursor: pointer;
    background: rgba(255,255,255,.92); color: #16315f; text-shadow: none;
  }
  .suggerimenti { margin: -6px 0 14px; display: none; }
  .suggerimenti div {
    padding: 12px 16px; background: rgba(255,255,255,.22); border-radius: 14px; margin-bottom: 6px; cursor: pointer; font-size: .95rem;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }

  /* Carte in vetro */
  .card {
    background: rgba(255,255,255,.13);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.24);
    border-radius: 30px; padding: 18px 16px; margin-bottom: 14px;
    box-shadow: 0 18px 40px rgba(0,0,0,.2);
  }
  .titolo { font-size: .72rem; text-transform: uppercase; letter-spacing: 1px; opacity: .8; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .titolo small { text-transform: none; letter-spacing: 0; font-size: .72rem; }

  /* Hero */
  .hero { text-align: center; padding: 26px 18px 20px; }
  .citta { font-size: 1.4rem; font-weight: 600; letter-spacing: .3px; }
  .ora { font-size: .78rem; opacity: .8; margin-top: 4px; }
  #icona { margin-top: 10px; animation: fluttua 5s ease-in-out infinite; }
  @keyframes fluttua { 50% { transform: translateY(-7px); } }
  .temp { font-size: 7.2rem; font-weight: 200; line-height: .95; letter-spacing: -4px; margin-left: 14px; }
  .desc { font-size: 1.2rem; font-weight: 500; margin-top: 4px; }
  .maxmin { font-size: 1rem; opacity: .9; margin: 6px 0 18px; }
  .dettagli { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .box { background: rgba(255,255,255,.14); border-radius: 18px; padding: 12px 6px; }
  .box span { display: block; font-size: .68rem; opacity: .78; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .7px; }
  .box b { font-size: 1.15rem; font-weight: 600; }

  /* Prossime 24 ore */
  .ore { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; scrollbar-width: none; }
  .ore::-webkit-scrollbar { display: none; }
  .ora-box { flex: 0 0 auto; width: 62px; text-align: center; background: rgba(255,255,255,.12); border-radius: 18px; padding: 10px 4px; font-size: .85rem; scroll-snap-align: start; }
  .ora-box.adesso { background: rgba(255,255,255,.26); }
  .ora-box .svg-ic { margin: 6px auto; }
  .ora-box .pp { display: block; font-size: .68rem; color: #bfe6ff; height: 1em; margin-top: 2px; }

  /* Prossimi 7 giorni */
  .giorno { border-bottom: 1px solid rgba(255,255,255,.14); }
  .giorno:last-child { border-bottom: none; }
  .riga { display: grid; grid-template-columns: 46px 34px 34px 28px 1fr 28px 14px; gap: 5px; align-items: center; padding: 9px 0; cursor: pointer; font-size: .92rem; }
  .riga .nome { text-transform: capitalize; font-weight: 600; line-height: 1.15; }
  .riga .nome small { display: block; font-weight: 400; font-size: .66rem; }
  .riga .pioggia { font-size: .72rem; color: #bfe6ff; text-align: center; }
  .riga .min { opacity: .75; text-align: right; }
  .riga .max { font-weight: 600; }
  .barra { height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); position: relative; }
  .barra i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #4fc3f7, #ffd54f, #ff8a65); }
  .freccia { font-size: .8rem; opacity: .7; transition: transform .25s; text-align: center; }
  .giorno.aperto .freccia { transform: rotate(90deg); }
  .dett { display: none; margin: 0 0 10px; background: rgba(0,0,0,.14); border-radius: 18px; padding: 8px 12px; animation: apri .25s ease; }
  .giorno.aperto .dett { display: block; }
  @keyframes apri { from { opacity: 0; transform: translateY(-6px); } }
  .dett .sub { font-size: .78rem; opacity: .85; text-align: center; padding: 4px 0 8px; }
  .hrow { display: grid; grid-template-columns: 44px 30px 40px 1fr 1fr; gap: 4px; align-items: center; padding: 4px 0; font-size: .86rem; border-top: 1px solid rgba(255,255,255,.08); }
  .hrow span { text-align: right; font-size: .78rem; opacity: .9; }
  .hrow span:nth-of-type(1) { color: #bfe6ff; }

  /* Pulsanti */
  .stato { text-align: center; font-size: .8rem; opacity: .85; margin: 6px 0 10px; min-height: 1.2em; }
  .azioni { display: flex; gap: 10px; }
  .azioni button {
    flex: 1; padding: 14px; border: none; border-radius: 16px; font-size: .95rem; font-weight: 600; cursor: pointer;
    background: rgba(255,255,255,.92); color: #16315f; text-shadow: none; transition: transform .15s;
  }
  .azioni button:active { transform: scale(.97); }
  .nota { font-size: .68rem; opacity: .6; text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<!-- Sfumature condivise da tutte le icone -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="gSole" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#FFF6B0"/><stop offset=".5" stop-color="#FFC83D"/><stop offset="1" stop-color="#FF8F1F"/>
    </radialGradient>
    <radialGradient id="gAlone">
      <stop offset="0" stop-color="#FFE082" stop-opacity=".7"/><stop offset="1" stop-color="#FFE082" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gLuna" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#E3E8F1"/><stop offset="1" stop-color="#AEB8CC"/>
    </linearGradient>
    <radialGradient id="gLunaAlone">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".4"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gNubeB" gradientUnits="userSpaceOnUse" x1="0" y1="19" x2="0" y2="52">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#BFD1E6"/>
    </linearGradient>
    <linearGradient id="gNubeG" gradientUnits="userSpaceOnUse" x1="0" y1="19" x2="0" y2="52">
      <stop offset="0" stop-color="#E6ECF3"/><stop offset="1" stop-color="#8C9FB6"/>
    </linearGradient>
    <linearGradient id="gNubeS" gradientUnits="userSpaceOnUse" x1="0" y1="19" x2="0" y2="52">
      <stop offset="0" stop-color="#9AA8BD"/><stop offset="1" stop-color="#4B566A"/>
    </linearGradient>
    <linearGradient id="gNubeN" gradientUnits="userSpaceOnUse" x1="0" y1="19" x2="0" y2="52">
      <stop offset="0" stop-color="#F6F9FD"/><stop offset="1" stop-color="#B5C7DB"/>
    </linearGradient>
    <linearGradient id="gNubeF" gradientUnits="userSpaceOnUse" x1="0" y1="19" x2="0" y2="52">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D3DCE6"/>
    </linearGradient>
    <linearGradient id="gGoccia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6DCFF"/><stop offset="1" stop-color="#2F86FF"/>
    </linearGradient>
    <linearGradient id="gFulmine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF59D"/><stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
</svg>

<canvas id="fx"></canvas>
<div class="wrap">

  <div class="cerca">
    <input id="cerca" type="search" placeholder="Cerca una città..." autocomplete="off">
    <button onclick="cercaCitta()" aria-label="Cerca">🔍</button>
  </div>
  <div class="suggerimenti" id="sugg"></div>

  <div class="card hero">
    <div class="citta" id="citta">📍 ...</div>
    <div class="ora" id="ora">Caricamento...</div>
    <div id="icona"></div>
    <div class="temp" id="temp">--°</div>
    <div class="desc" id="desc">Sto chiamando l'API...</div>
    <div class="maxmin" id="maxmin"></div>
    <div class="dettagli">
      <div class="box"><span>Vento</span><b id="vento">--</b></div>
      <div class="box"><span>Pioggia</span><b id="pioggia">--</b></div>
      <div class="box"><span>Alba</span><b id="alba">--</b></div>
      <div class="box"><span>Tramonto</span><b id="tramonto">--</b></div>
    </div>
  </div>

  <div class="card">
    <div class="titolo">Prossime 24 ore <small>scorri →</small></div>
    <div class="ore" id="ore"></div>
  </div>

  <div class="card">
    <div class="titolo">Prossimi 7 giorni <small>tocca un giorno per le ore</small></div>
    <div id="giorni"></div>
  </div>

  <div class="stato" id="stato"></div>
  <div class="azioni">
    <button onclick="usaGPS()">📍 La mia posizione</button>
    <button onclick="carica()">🔄 Aggiorna</button>
  </div>
  <div class="nota">Dati da Open-Meteo.com · API gratuita, senza chiave</div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- Testi meteo ---------- */
const TESTI = {
  0: "Sereno", 1: "Quasi sereno", 2: "Parzialmente nuvoloso", 3: "Coperto",
  45: "Nebbia", 48: "Nebbia con brina",
  51: "Pioviggine leggera", 53: "Pioviggine", 55: "Pioviggine intensa", 56: "Pioggia gelata", 57: "Pioggia gelata",
  61: "Pioggia leggera", 63: "Pioggia", 65: "Pioggia forte", 66: "Pioggia gelata", 67: "Pioggia gelata",
  71: "Neve leggera", 73: "Neve", 75: "Neve forte", 77: "Granelli di neve",
  80: "Rovesci", 81: "Rovesci forti", 82: "Rovesci violenti", 85: "Rovesci di neve", 86: "Forti rovesci di neve",
  95: "Temporale", 96: "Temporale con grandine", 99: "Temporale forte"
};
const testo = c => TESTI[c] || "Meteo";
const direzione = g => ["N","NE","E","SE","S","SO","O","NO"][Math.round(g / 45) % 8];

/* ---------- ICONE-INIZIO: 3D sfumate (SVG) ---------- */
const SOLE = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">`
  + `<circle class="alone" cx="32" cy="32" r="26" fill="url(#gAlone)"/>`
  + `<g class="raggi" stroke="#FFB52E" stroke-width="3.6" stroke-linecap="round"><path d="M32 6v7M32 51v7M6 32h7M51 32h7M13.6 13.6l5 5M45.4 45.4l5 5M13.6 50.4l5-5M45.4 18.6l5-5"/></g>`
  + `<circle cx="32" cy="32" r="12.5" fill="url(#gSole)"/>`
  + `<ellipse cx="28" cy="27.5" rx="4.5" ry="2.8" fill="#fff" opacity=".55" transform="rotate(-30 28 27.5)"/></g>`;

const LUNA = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">`
  + `<circle class="alone" cx="30" cy="32" r="24" fill="url(#gLunaAlone)"/>`
  + `<path d="M32.07 12.11A20 20 0 1 0 48.53 39.53A16 16 0 1 1 32.07 12.11z" fill="url(#gLuna)"/>`
  + `<g fill="#8C97AD" opacity=".22"><circle cx="24" cy="38" r="2.4"/><circle cx="21.5" cy="27" r="1.7"/><circle cx="28" cy="45" r="1.9"/></g>`
  + `<path class="stella" d="M44 17.5L45.3 21.1L48.9 22.4L45.3 23.7L44 27.3L42.7 23.7L39.1 22.4L42.7 21.1Z" fill="#fff"/>`
  + `<path class="stella" style="animation-delay:1.2s" d="M52 31L52.9 33.6L55.5 34.5L52.9 35.4L52 38L51.1 35.4L48.5 34.5L51.1 33.6Z" fill="#fff"/></g>`;

const NUV = (x, y, s, g, gl) => `<g transform="translate(${x} ${y}) scale(${s})">`
  + `<g fill="url(#${g})"><circle cx="25" cy="36" r="10"/><circle cx="37" cy="31" r="12.5"/><circle cx="47" cy="38" r="8.5"/><rect x="13" y="38" width="42" height="14" rx="7"/></g>`
  + `<ellipse cx="34" cy="25.5" rx="7" ry="3.6" fill="#fff" opacity="${gl === undefined ? .55 : gl}"/></g>`;

const GOCCIA = (x, y, d) => `<g transform="translate(${x} ${y})"><path class="goccia" style="animation-delay:${d}s" d="M0-4.2C1.6-1.8 3-.2 3 1.8A3 3 0 0 1-3 1.8C-3-.2-1.6-1.8 0-4.2z" fill="url(#gGoccia)"/></g>`;
const FIOCCO = (x, y, d) => `<g transform="translate(${x} ${y})"><g class="fiocco" style="animation-delay:${d}s"><path d="M0-3.6V3.6M-3.1-1.8L3.1 1.8M-3.1 1.8L3.1-1.8" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none"/></g></g>`;

function icona(c, giorno, s, anim) {
  let g;
  if (c === 0) g = giorno ? SOLE(0, 0, 1) : LUNA(0, 0, 1);
  else if (c === 1 || c === 2) g = (giorno ? SOLE(0, -4, .8) : LUNA(0, -4, .8)) + NUV(7, 10, .85, "gNubeB");
  else if (c === 3) g = `<g class="nuvola-a">${NUV(-8, -8, .75, "gNubeG", .4)}</g>` + NUV(3, 2, .95, "gNubeB");
  else if (c === 45 || c === 48) g = NUV(0, -6, .95, "gNubeF", .4)
    + '<g fill="#fff" opacity=".92"><rect class="nebbia-l" x="12" y="45.5" width="40" height="4" rx="2"/><rect class="nebbia-l" style="animation-delay:-2s" x="18" y="52" width="34" height="4" rx="2"/><rect class="nebbia-l" style="animation-delay:-4s" x="10" y="58.5" width="38" height="4" rx="2"/></g>';
  else if (c >= 95) g = NUV(0, -6, .95, "gNubeS", .25)
    + '<path class="fulmine" d="M36 38L26 53h8l-3.5 10.5L45 46h-8.5z" fill="url(#gFulmine)" stroke="#FF9800" stroke-width=".8" stroke-linejoin="round"/>';
  else if ((c >= 71 && c <= 77) || c === 85 || c === 86) g = NUV(0, -6, .95, "gNubeN", .5)
    + FIOCCO(23, 50, 0) + FIOCCO(33, 55, 1.1) + FIOCCO(43, 50, 2.1);
  else g = NUV(0, -6, .95, "gNubeG", .45) + GOCCIA(23, 49, 0) + GOCCIA(33, 52, .37) + GOCCIA(43, 49, .74);
  return `<svg class="svg-ic${anim ? " anim" : ""}" viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true">${g}</svg>`;
}
/* ---------- ICONE-FINE ---------- */

/* ---------- Temi: colori di sfondo secondo il meteo ---------- */
const PALETTE = {
  sereno:    { g: ["#1e88e5", "#42a5f5", "#90caf9"], n: ["#0b1026", "#1b2a5a", "#2d4a8a"] },
  nuvoloso:  { g: ["#4a6580", "#6b86a0", "#9fb3c8"], n: ["#131a24", "#1f2a38", "#2c3a4c"] },
  nebbia:    { g: ["#6b7882", "#8793a0", "#aab4be"], n: ["#1a2026", "#2a323a", "#3b444d"] },
  pioggia:   { g: ["#35506b", "#4f6d8a", "#7b97b0"], n: ["#0e1822", "#1a2b3a", "#263b4d"] },
  temporale: { g: ["#2b3445", "#3d4a60", "#5a6a84"], n: ["#0a0d14", "#141a28", "#202a3d"] },
  neve:      { g: ["#4d7396", "#6f93b3", "#9bb7cf"], n: ["#1a2634", "#2c3e52", "#4a6078"] }
};
function tema(c) {
  if (c <= 1) return "sereno";
  if (c <= 3) return "nuvoloso";
  if (c === 45 || c === 48) return "nebbia";
  if (c >= 95) return "temporale";
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "neve";
  return "pioggia";
}
function applicaTema(c, giorno) {
  const t = tema(c), p = PALETTE[t][giorno ? "g" : "n"];
  const r = document.documentElement.style;
  r.setProperty("--bg1", p[0]); r.setProperty("--bg2", p[1]); r.setProperty("--bg3", p[2]);
  document.querySelector('meta[name="theme-color"]').content = p[0];
  fx.tema = t; fx.notte = !giorno; costruisciFx();
  if (RM) disegna(0);
}

/* ---------- Animazioni di sfondo (pioggia, neve, stelle, nuvole) ---------- */
const cv = $("fx"), ctx = cv.getContext("2d");
const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let W = 0, H = 0, flash = 0;
const fx = { tema: "sereno", notte: false };
const P = { rain: [], snow: [], stars: [], clouds: [] };
const rnd = (a, b) => a + Math.random() * (b - a);

function ridimensiona() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  costruisciFx();
}
function costruisciFx() {
  const t = fx.tema;
  P.rain = []; P.snow = []; P.stars = []; P.clouds = [];
  if (t === "pioggia" || t === "temporale") {
    const n = t === "temporale" ? 150 : 90;
    for (let i = 0; i < n; i++) P.rain.push({ x: rnd(0, W), y: rnd(0, H), l: rnd(10, 22), v: rnd(11, 18) });
  }
  if (t === "neve") {
    for (let i = 0; i < 90; i++) P.snow.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(1.5, 3.5), v: rnd(.5, 1.4), d: rnd(0, 6.28) });
  }
  if (fx.notte && (t === "sereno" || t === "nuvoloso" || t === "nebbia")) {
    for (let i = 0; i < 80; i++) P.stars.push({ x: rnd(0, W), y: rnd(0, H * .75), r: rnd(.5, 1.6), p: rnd(0, 6.28) });
  }
  const nc = { sereno: 2, nuvoloso: 6, nebbia: 5, pioggia: 6, temporale: 6, neve: 4 }[t] || 3;
  for (let i = 0; i < nc; i++) P.clouds.push({ x: rnd(-100, W), y: rnd(0, H * .6), r: rnd(90, 190), v: rnd(.08, .3) });
}
function disegna(t) {
  ctx.clearRect(0, 0, W, H);
  const col = fx.tema === "temporale" ? "40,48,66" : (fx.notte ? "180,195,215" : "255,255,255");
  const a = { sereno: .10, nuvoloso: .22, nebbia: .28, pioggia: .16, temporale: .35, neve: .18 }[fx.tema] || .12;
  for (const c of P.clouds) {
    c.x += c.v; if (c.x - c.r > W) c.x = -c.r;
    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 6.283); ctx.fill();
  }
  for (const s of P.stars) {
    ctx.fillStyle = `rgba(255,255,255,${.35 + .65 * Math.abs(Math.sin(t / 900 + s.p))})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  }
  if (P.rain.length) {
    ctx.strokeStyle = "rgba(200,225,255,.55)"; ctx.lineWidth = 1.2; ctx.beginPath();
    for (const r of P.rain) {
      ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - 2, r.y + r.l);
      r.y += r.v; r.x -= .4;
      if (r.y > H) { r.y = -24; r.x = rnd(0, W); }
    }
    ctx.stroke();
  }
  if (P.snow.length) {
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (const s of P.snow) {
      s.d += .01; s.x += Math.sin(s.d) * .5; s.y += s.v;
      if (s.y > H) { s.y = -6; s.x = rnd(0, W); }
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
  }
  if (fx.tema === "temporale") {
    if (flash <= 0 && Math.random() < .004) flash = 1;
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * .35})`; ctx.fillRect(0, 0, W, H); flash -= .06; }
  }
}
function ciclo(t) { disegna(t); requestAnimationFrame(ciclo); }
addEventListener("resize", ridimensiona);

/* ---------- Luogo e dati ---------- */
let luogo = { nome: "Milano", lat: 45.46, lon: 9.19 };
try { const s = JSON.parse(localStorage.getItem("luogo")); if (s) luogo = s; } catch (e) {}
let DATI = null;

function costruisciURL() {
  return "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + luogo.lat + "&longitude=" + luogo.lon
    + "&current_weather=true"
    + "&hourly=temperature_2m,weathercode,precipitation_probability,windspeed_10m,is_day"
    + "&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset"
    + "&forecast_days=8&timezone=auto";
}

/* Dettaglio ora per ora di un giorno */
function dettaglio(k) {
  const h = DATI.hourly, d = DATI.daily, data = d.time[k];
  let html = `<div class="sub">🌅 ${d.sunrise[k].slice(11, 16)} &nbsp;·&nbsp; 🌇 ${d.sunset[k].slice(11, 16)}</div>`;
  for (let i = 0; i < h.time.length; i++) {
    if (!h.time[i].startsWith(data)) continue;
    const p = h.precipitation_probability[i];
    html += `<div class="hrow"><b>${h.time[i].slice(11, 16)}</b>${icona(h.weathercode[i], h.is_day[i] === 1, 28)}`
      + `<b>${Math.round(h.temperature_2m[i])}°</b><span>${p == null ? "" : "💧 " + p + "%"}</span>`
      + `<span>${Math.round(h.windspeed_10m[i])} km/h</span></div>`;
  }
  return html;
}

function apriGiorno(el, k) {
  const gia = el.classList.contains("aperto");
  document.querySelectorAll(".giorno.aperto").forEach(x => x.classList.remove("aperto"));
  if (gia) return;
  const box = el.querySelector(".dett");
  if (!box.innerHTML) box.innerHTML = dettaglio(k);
  el.classList.add("aperto");
}

function mostra(dati, daCache) {
  DATI = dati;
  const c = dati.current_weather, h = dati.hourly, d = dati.daily;
  const giorno = c.is_day === 1;
  let i0 = h.time.findIndex(t => t.startsWith(c.time.slice(0, 13)));
  if (i0 < 0) i0 = 0;

  applicaTema(c.weathercode, giorno);

  $("citta").textContent = "📍 " + luogo.nome;
  $("icona").innerHTML = icona(c.weathercode, giorno, 150, true);
  $("temp").textContent = Math.round(c.temperature) + "°";
  $("desc").textContent = testo(c.weathercode);
  $("maxmin").textContent = "↑ " + Math.round(d.temperature_2m_max[0]) + "°   ↓ " + Math.round(d.temperature_2m_min[0]) + "°";
  $("vento").textContent = Math.round(c.windspeed) + " km/h " + direzione(c.winddirection);
  const pp = h.precipitation_probability[i0];
  $("pioggia").textContent = pp == null ? "--" : pp + "%";
  $("alba").textContent = d.sunrise[0].slice(11, 16);
  $("tramonto").textContent = d.sunset[0].slice(11, 16);

  // Prossime 24 ore
  let oreHtml = "";
  for (let i = i0; i < i0 + 24 && i < h.time.length; i++) {
    const p = h.precipitation_probability[i];
    oreHtml += `<div class="ora-box${i === i0 ? " adesso" : ""}"><small>${i === i0 ? "Ora" : h.time[i].slice(11, 16)}</small>`
      + icona(h.weathercode[i], h.is_day[i] === 1, 34)
      + `<b>${Math.round(h.temperature_2m[i])}°</b><span class="pp">${p != null && p >= 10 ? p + "%" : ""}</span></div>`;
  }
  $("ore").innerHTML = oreHtml;
  $("ore").scrollLeft = 0;

  // Prossimi 7 giorni
  const mins = [], maxs = [];
  for (let k = 1; k <= 7; k++) { mins.push(d.temperature_2m_min[k]); maxs.push(d.temperature_2m_max[k]); }
  const gmin = Math.min(...mins), gmax = Math.max(...maxs), range = (gmax - gmin) || 1;
  const cont = $("giorni"); cont.innerHTML = "";
  for (let k = 1; k <= 7 && k < d.time.length; k++) {
    const dt = new Date(d.time[k] + "T12:00:00");
    const nome = dt.toLocaleDateString("it-IT", { weekday: "short" }).replace(".", "");
    const num = dt.toLocaleDateString("it-IT", { day: "numeric", month: "short" }).replace(".", "");
    const mn = d.temperature_2m_min[k], mx = d.temperature_2m_max[k];
    const left = (mn - gmin) / range * 100, width = Math.max((mx - mn) / range * 100, 8);
    const pr = d.precipitation_probability_max[k];
    const el = document.createElement("div");
    el.className = "giorno";
    el.innerHTML = `<div class="riga"><div class="nome">${nome}<small>${num}</small></div>`
      + icona(d.weathercode[k], true, 32)
      + `<div class="pioggia">${pr != null && pr >= 10 ? "💧" + pr + "%" : ""}</div>`
      + `<div class="min">${Math.round(mn)}°</div>`
      + `<div class="barra"><i style="left:${left}%;width:${Math.min(width, 100 - left)}%"></i></div>`
      + `<div class="max">${Math.round(mx)}°</div><div class="freccia">›</div></div><div class="dett"></div>`;
    el.querySelector(".riga").addEventListener("click", () => apriGiorno(el, k));
    cont.appendChild(el);
  }

  $("ora").textContent = daCache ? "Dati salvati (sei offline)" : "Aggiornato alle " +
    new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  $("stato").textContent = daCache ? "⚠️ Nessuna connessione: mostro l'ultimo meteo salvato" : "";
}

async function carica() {
  $("stato").textContent = "Aggiorno...";
  try {
    const r = await fetch(costruisciURL());          // 1. richiesta all'API
    const dati = await r.json();                      // 2. risposta in JSON
    try { localStorage.setItem("ultimiDati2", JSON.stringify({ luogo, dati })); } catch (e) {}
    mostra(dati, false);                              // 3. scrivo i dati nella pagina
  } catch (e) {
    try {
      const salvato = JSON.parse(localStorage.getItem("ultimiDati2"));
      if (salvato) { luogo = salvato.luogo; mostra(salvato.dati, true); return; }
    } catch (e2) {}
    $("stato").textContent = "⚠️ Impossibile contattare l'API. Controlla internet.";
    $("desc").textContent = "Errore";
  }
}

function salvaLuogo(nuovo) {
  luogo = nuovo;
  try { localStorage.setItem("luogo", JSON.stringify(luogo)); } catch (e) {}
  carica();
}

/* GPS del telefono */
function usaGPS() {
  if (!navigator.geolocation) { $("stato").textContent = "GPS non disponibile"; return; }
  $("stato").textContent = "Cerco la tua posizione...";
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = +pos.coords.latitude.toFixed(3), lon = +pos.coords.longitude.toFixed(3);
    let nome = "La tua posizione";
    try {
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=it`);
      const d = await r.json();
      nome = d.city || d.locality || nome;
    } catch (e) {}
    salvaLuogo({ nome, lat, lon });
  }, () => { $("stato").textContent = "Permesso GPS negato"; }, { timeout: 10000 });
}

/* Ricerca città */
async function cercaCitta() {
  const q = $("cerca").value.trim();
  if (q.length < 2) return;
  try {
    const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=5&language=it&name=" + encodeURIComponent(q));
    const d = await r.json();
    const box = $("sugg");
    if (!d.results) { box.style.display = "block"; box.innerHTML = "<div>Nessun risultato</div>"; return; }
    box.innerHTML = "";
    d.results.forEach(c => {
      const el = document.createElement("div");
      el.textContent = c.name + (c.admin1 ? ", " + c.admin1 : "") + " (" + c.country_code + ")";
      el.onclick = () => {
        box.style.display = "none"; $("cerca").value = "";
        salvaLuogo({ nome: c.name, lat: c.latitude, lon: c.longitude });
      };
      box.appendChild(el);
    });
    box.style.display = "block";
  } catch (e) { $("stato").textContent = "Ricerca non riuscita (serve internet)"; }
}
$("cerca").addEventListener("keydown", e => { if (e.key === "Enter") cercaCitta(); });

ridimensiona();
if (!RM) requestAnimationFrame(ciclo);
carica();

// Service worker: serve a Android per riconoscere la pagina come app installabile
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
